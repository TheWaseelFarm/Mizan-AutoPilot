name: Mizān cron

# Scheduled jobs for Mizān, run from GitHub Actions. Each step calls a Vercel API endpoint
# and authenticates with the CRON_SECRET repository secret via an Authorization: Bearer header,
# which api/_lib/cron.js (requireCron) accepts. Set the secret under:
#   Settings → Secrets and variables → Actions → New repository secret → name: CRON_SECRET
# (its value MUST equal the CRON_SECRET env var in Vercel).
# Run any job on demand from the Actions tab (Run workflow).

on:
  schedule:
    - cron: '*/30 * * * *'   # ingest: new filings + prices, every 30 min (UTC)
    - cron: '0 7 * * *'      # screening: rescreen, daily at 07:00 UTC
  workflow_dispatch: {}

concurrency:
  group: mizan-cron
  cancel-in-progress: false

env:
  BASE: https://mizan-auto-pilot.vercel.app

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Poll disclosures
        # Big-fund (SEC 13F) ingestion screens new tickers, so the first runs after a quarter's
        # filings can take a few minutes. A slow or failed poll must never block price refresh.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          resp=$(curl -fsS --max-time 420 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/poll-disclosures")
          echo "poll-disclosures -> $resp"
      - name: Refresh prices
        if: ${{ always() }}
        # Each call refreshes <= 8 tickers (Twelve Data free tier: 8 calls/min, 800/day). Loop one
        # call per minute until nothing is due (a ticker is due when never fetched or last
        # touched on an earlier UTC day — once a day, never on weekends) or the provider rate-limits us. Steady state: the first call
        # returns remaining=0 and the loop exits immediately.
        timeout-minutes: 30
        env:
          # Repo variable (Settings → Variables). Unset = 61s, safe for the free tier (8 calls/min).
          # On a paid plan with PRICE_BATCH_SIZE raised in Vercel, set it to e.g. 5.
          PRICE_LOOP_SLEEP: ${{ vars.PRICE_LOOP_SLEEP }}
        run: |
          for i in $(seq 1 24); do
            resp=$(curl -fsS --max-time 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/refresh-prices")
            echo "refresh-prices [$i] -> $resp"
            echo "$resp" | grep -q '"rateLimited":true' && { echo "rate limited — stopping, next run continues"; break; }
            echo "$resp" | grep -Eq '"remaining":0[,}]' && break
            sleep "${PRICE_LOOP_SLEEP:-61}"
          done

  rescreen:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Rescreen tickers (Sharia screening)
        run: |
          resp=$(curl -fsS --max-time 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/rescreen")
          echo "rescreen -> $resp"
