name: Mizān cron

# Scheduled jobs for Mizān, run from GitHub Actions (replaces the external cron-job.org
# jobs — more reliable and visible here). Each step calls a Vercel API endpoint and
# authenticates with the CRON_SECRET repository secret via an Authorization: Bearer header,
# which api/_lib/cron.js (requireCron) accepts. Set the secret under:
#   Settings → Secrets and variables → Actions → New repository secret → name: CRON_SECRET
# You can also run any job on demand from the Actions tab (Run workflow).

on:
  schedule:
    - cron: '*/30 * * * *'   # ingest: new filings + prices, every 30 min (UTC)
    - cron: '0 7 * * *'      # screening: rescreen, daily at 07:00 UTC
  workflow_dispatch: {}

concurrency:
  group: mizan-cron
  cancel-in-progress: false

env:
  BASE: https://mizan-auto-pilot.vercel.app

jobs:
  ingest:
    # the 30-min schedule, or any manual run
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Poll disclosures
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE/api/poll-disclosures" | head -c 800; echo
      - name: Refresh prices
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE/api/refresh-prices" | head -c 800; echo

  rescreen:
    # the daily schedule, or any manual run
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Rescreen tickers (Sharia screening)
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE/api/rescreen" | head -c 800; echo
