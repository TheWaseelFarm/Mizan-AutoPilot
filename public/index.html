<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mizān</title>
<style>
  :root{
    /* Light theme (mobile redesign handoff) */
    --bg:#F5F7FB;--surface:#FFFFFF;--surface-2:#EAEDF4;--line:rgba(16,26,45,.06);--line-2:rgba(16,26,45,.12);
    --ink:#141C2E;--muted:#64708A;--faint:#8A93A6;--gold:#B5892B;--gold-soft:rgba(181,137,43,.12);
    --clean:#3ECB86;--purify:#F3B24A;--fail:#F0625A;
    --clean-soft:rgba(62,203,134,.16);--purify-soft:rgba(243,178,74,.18);--fail-soft:rgba(240,98,90,.15);
    --slate:#AAB3C4;--slate-soft:rgba(147,160,184,.18);
    /* verdict TEXT (darkened for legibility on white) — bars/dots keep the fills above */
    --clean-txt:#12925A;--purify-txt:#B87A0C;--fail-txt:#D24A41;--slate-txt:#6B7690;
    --shadow:0 6px 20px -14px rgba(16,26,45,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:#E4E8EF;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;}
  #root{width:100%;display:flex;justify-content:center;}
  .app{width:100%;max-width:460px;height:100dvh;min-height:100dvh;position:relative;overflow:hidden;
    background:#F5F7FB;border-left:1px solid var(--line);border-right:1px solid var(--line);}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;}
  .detail{transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:25;background:linear-gradient(180deg,#0C1424 0%,#080D18 100%);}
  .detail.open{transform:translateX(0);}
  .topbar{flex:0 0 auto;height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,247,251,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:20;}
  .topdate{font-size:13px;font-weight:600;color:var(--faint);}
  .mmark{flex:none;}
  .brand{display:flex;align-items:center;gap:9px;}
  .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#1c2b4c,#0a1120);border:1px solid rgba(217,180,80,.5);box-shadow:inset 0 0 10px rgba(217,180,80,.15);}
  .brand b{font-size:19px;letter-spacing:-.01em;font-weight:800;color:var(--gold);}
  .top-actions{display:flex;gap:8px;}
  .icon-btn{width:38px;height:38px;border:0;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer;font-size:15px;border:1px solid var(--line);}
  .icon-btn:active{transform:scale(.94);}
  .scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none;}
  .hero{padding:18px 16px 6px;}
  .eyebrow{display:flex;align-items:center;justify-content:space-between;color:var(--faint);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;}
  .hero h1{margin:9px 0 2px;font-size:30px;font-weight:820;letter-spacing:-.8px;}
  .hero h1 span{color:var(--muted);font-size:15px;font-weight:700;letter-spacing:0;}
  .balance{margin-top:16px;}
  .balance-track{height:14px;border-radius:8px;overflow:hidden;display:flex;background:var(--surface);border:1px solid var(--line);position:relative;}
  .balance-track i{display:block;height:100%;}
  .b-clean{background:linear-gradient(90deg,#34b978,#43d692);}
  .b-purify{background:linear-gradient(90deg,#e7a63b,#f6bd5a);}
  .b-fail{background:linear-gradient(90deg,#e15750,#f26f68);}
  .fulcrum{position:absolute;top:-4px;bottom:-4px;left:50%;width:2px;transform:translateX(-50%);background:rgba(255,255,255,.28);border-radius:2px;}
  .legend{margin-top:12px;display:flex;gap:16px;}
  .legend div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:650;}
  .legend b{color:var(--ink);font-weight:820;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.c{background:var(--clean);}.dot.p{background:var(--purify);}.dot.f{background:var(--fail);}
  .segment{position:sticky;top:0;z-index:15;padding:12px 20px 12px;background:linear-gradient(180deg,rgba(245,247,251,.98),rgba(245,247,251,.85));backdrop-filter:blur(10px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .segment::-webkit-scrollbar{display:none;}
  .seg{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:13px;font-weight:750;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.15s;}
  .seg .dot{width:8px;height:8px;}
  .seg.active{color:#fff;background:var(--gold);border-color:var(--gold);}
  .seg.active.clean{background:var(--clean-txt);border-color:var(--clean-txt);}
  .seg.active.purify{background:var(--purify-txt);border-color:var(--purify-txt);}
  .seg.active.fail{background:var(--fail-txt);border-color:var(--fail-txt);}
  .list-head{padding:6px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;}
  .list-head h2{font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--muted);text-transform:uppercase;}
  .list-head span{font-size:12px;color:var(--faint);font-weight:650;}
  .list{padding:0 14px 26px;display:flex;flex-direction:column;gap:10px;}
  .card{position:relative;border-radius:20px;padding:15px 15px 14px 18px;background:linear-gradient(180deg,var(--surface),#0F1830);border:1px solid var(--line);cursor:pointer;transition:transform .14s,border-color .14s;}
  .card:active{transform:scale(.985);border-color:var(--line-2);}
  .card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--faint);}
  .card.clean::before{background:var(--clean);}.card.purify::before{background:var(--purify);}.card.fail::before{background:var(--fail);}
  .c-top{display:flex;align-items:center;gap:10px;}
  .avatar{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:820;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);}
  .avatar.fund{color:var(--gold);background:var(--gold-soft);border-color:rgba(181,137,43,.3);}
  .c-who{min-width:0;flex:1;}
  .c-who b{display:block;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .c-who span{font-size:11.5px;color:var(--faint);}
  .c-time{font-size:11.5px;color:var(--faint);font-weight:650;flex:0 0 auto;}
  .c-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px;}
  .c-ticker{font-size:25px;font-weight:850;letter-spacing:-.8px;line-height:1;}
  .c-co{margin-top:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;}
  .badge{flex:0 0 auto;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:820;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .badge.clean{color:var(--clean-txt);background:var(--clean-soft);}.badge.purify{color:var(--purify-txt);background:var(--purify-soft);}.badge.fail{color:var(--fail-txt);background:var(--fail-soft);}
  .c-meta{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);font-weight:600;}
  .side{padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);font-weight:750;font-size:11px;letter-spacing:.2px;color:var(--ink);}
  .side.sell{color:var(--gold);background:var(--gold-soft);border-color:rgba(217,180,80,.25);}
  .sep{color:var(--faint);}
  .chev{margin-left:auto;color:var(--faint);font-size:15px;}
  .tabs{flex:0 0 auto;height:86px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(16,26,45,.07);z-index:20;}
  .tab{border:0;background:transparent;color:#9BA4B5;display:grid;place-items:center;gap:4px;font-size:10.5px;font-weight:600;cursor:pointer;border-radius:14px;}
  .tab .ti{font-size:18px;line-height:1;}
  .tab.active{color:var(--gold);}
  .scrim{position:absolute;inset:0;background:rgba(16,26,45,.35);opacity:0;pointer-events:none;transition:.2s;z-index:30;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);background:#FFFFFF;border-top:1px solid var(--line-2);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -18px rgba(16,26,45,.3);}
  .sheet.open{transform:translateY(0);}
  .grab{width:40px;height:4px;border-radius:3px;background:var(--line-2);margin:4px auto 14px;}
  .sheet h3{margin:0 0 4px;font-size:17px;font-weight:820;}
  .sheet .sub{margin:0 0 16px;font-size:12.5px;color:var(--muted);}
  .field{height:44px;border-radius:13px;background:var(--surface);border:1px solid var(--line-2);display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--faint);margin-bottom:16px;}
  .field input{border:0;background:transparent;color:var(--ink);width:100%;outline:0;font-size:14px;}
  .flabel{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:0 0 8px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
  .chip.on{color:#fff;background:var(--gold);border-color:var(--gold);}
  .apply{width:100%;height:50px;border:0;border-radius:15px;background:var(--gold);color:#1a1204;font-size:15px;font-weight:850;cursor:pointer;margin-top:4px;}
  .d-head{flex:0 0 auto;height:58px;padding:0 8px 0 6px;display:flex;align-items:center;gap:6px;background:rgba(10,15,28,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:20;}
  .back{width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:26px;cursor:pointer;border-radius:12px;}
  .back:active{background:rgba(255,255,255,.06);}
  .d-head .d-tk{font-size:15px;font-weight:820;letter-spacing:-.2px;}
  .d-head .badge{margin-left:auto;margin-right:6px;padding:6px 11px;font-size:11.5px;}
  .d-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:16px 16px 30px;}
  .d-scroll::-webkit-scrollbar{display:none;}
  .d-big{font-size:42px;font-weight:860;letter-spacing:-1.4px;line-height:1;margin-top:8px;}
  .d-co{margin-top:6px;color:var(--muted);font-size:14px;}
  .d-line{margin-top:14px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;flex-wrap:wrap;}
  .sect{margin-top:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;}
  .sect-h{padding:14px 16px 4px;display:flex;align-items:center;justify-content:space-between;}
  .sect-h h3{font-size:14px;font-weight:820;letter-spacing:.2px;margin:0;}
  .sect-h em{font-style:normal;color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;}
  .row{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);}
  .row.first{border-top:0;}
  .row small{color:var(--muted);font-size:12.5px;font-weight:650;}
  .row b{font-size:13px;font-weight:750;}
  .vchip{padding:6px 11px;border-radius:9px;font-size:11.5px;font-weight:800;}
  .vchip.pass{color:var(--clean-txt);background:var(--clean-soft);}.vchip.watch{color:var(--purify-txt);background:var(--purify-soft);}.vchip.fail{color:var(--fail-txt);background:var(--fail-soft);}
  .meter-row{padding:13px 16px;border-top:1px solid var(--line);}
  .meter-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .meter-top small{color:var(--muted);font-size:12.5px;font-weight:650;}
  .meter-top b{font-size:13px;font-weight:800;}
  .meter{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
  .meter i{display:block;height:100%;border-radius:6px;}
  .meter i.ok{background:var(--clean);}.meter i.warn{background:var(--purify);}.meter i.adv{background:linear-gradient(90deg,#5b6b90,#8391b0);}
  .adv-tag{color:var(--faint);font-size:11px;font-weight:700;}
  .why{padding:14px 16px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.55;}
  .facts{padding:6px 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
  .fact small{display:block;color:var(--faint);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;}
  .fact b{display:block;margin-top:4px;font-size:13px;font-weight:750;}
  .disc{margin-top:16px;color:var(--faint);font-size:11px;line-height:1.5;text-align:center;padding:0 8px;}
  .page{padding:18px 16px 26px;}
  .page h2{font-size:22px;font-weight:840;letter-spacing:-.5px;margin:0 0 4px;}
  .page .note{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 16px;}
  .tracker{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;}
  .tracker .c-who{flex:1;}
  .toggle{width:48px;height:29px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);padding:3px;cursor:pointer;flex:0 0 auto;}
  .toggle i{display:block;width:21px;height:21px;border-radius:50%;background:#7c88a3;transition:.18s;}
  .toggle.on{background:var(--gold);border-color:var(--gold);}
  .toggle.on i{transform:translateX(19px);background:#1a1204;}
  .vcard{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;}
  .vcard .vh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .vcard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5;}
  .loading{padding:40px 16px;text-align:center;color:var(--faint);font-size:13px;}
  .empty{margin:0 14px;padding:30px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:20px;font-size:13px;}

  /* ---- Unscreened (no screening data — grey, never a verdict color) ---- */
  .b-unscreened{background:linear-gradient(90deg,#5b6b90,#8391b0);}
  .dot.u{background:var(--slate);}
  .card.unscreened::before{background:var(--slate);}
  .badge.unscreened{color:var(--slate-txt);background:var(--slate-soft);}
  .seg.active.unscreened{color:#fff;background:var(--slate-txt);border-color:var(--slate-txt);}
  .vchip.unscreened{color:var(--slate-txt);background:var(--slate-soft);}
  .unscreened-note{padding:14px 16px 16px;color:var(--muted);font-size:13px;line-height:1.55;}

  /* ---- Performance (evidence — MUTED, never a verdict color) ---- */
  .perf-primary{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .perf-primary small{display:block;color:var(--faint);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
  .perf-primary b{font-size:22px;font-weight:820;color:var(--ink);letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
  .perf-since-note{color:var(--faint);font-size:11px;font-weight:600;text-align:right;flex:0 0 auto;}
  .perf-chips{padding:8px 16px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .perf-chip{padding:10px 6px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:center;}
  .perf-chip small{display:block;color:var(--faint);font-size:10px;font-weight:800;letter-spacing:.4px;margin-bottom:4px;}
  .perf-chip b{font-size:12.5px;font-weight:750;color:var(--muted);font-variant-numeric:tabular-nums;}
  .perf-pending{padding:14px 16px 16px;color:var(--faint);font-size:12.5px;line-height:1.5;}
  .filer-link{cursor:pointer;border-radius:6px;}
  .filer-link:active{background:rgba(255,255,255,.05);}
  .filer-agg{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .filer-agg .fa{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);}
  .filer-agg .fa small{display:block;color:var(--faint);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
  .filer-agg .fa b{display:block;margin-top:5px;font-size:20px;font-weight:820;color:var(--ink);font-variant-numeric:tabular-nums;}

  /* ---- Detail: key-facts block ---- */
  .d-side{margin-top:12px;}
  .keyfacts{margin-top:14px;}
  .kf-filer{width:100%;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);font:inherit;}
  .kf-filer[disabled]{cursor:default;}
  .kf-filer:not([disabled]):active{border-color:var(--line-2);}
  .kf-filer .c-who{flex:1;min-width:0;}
  .kf-filer .c-who b{display:block;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kf-filer .c-who span{font-size:11.5px;color:var(--faint);}
  .kf-filer .chev{color:var(--faint);font-size:16px;flex:0 0 auto;}
  .kf-grid{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kf{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);}
  .kf small{display:block;color:var(--faint);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
  .kf b{display:block;margin-top:5px;font-size:14px;font-weight:750;color:var(--ink);font-variant-numeric:tabular-nums;}
  .kf .kf-sub{display:block;margin-top:3px;color:var(--faint);font-size:10.5px;font-weight:600;text-transform:none;letter-spacing:0;}
  .kf.pending b{color:var(--muted);}

  /* ---- Purification preview (advisory — gold accent, NOT verdict colors) ---- */
  .purif{margin-top:18px;border-radius:16px;padding:13px 15px;background:var(--gold-soft);border:1px solid rgba(217,180,80,.30);}
  .purif .ph{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#E7C86B;margin-bottom:6px;}
  .purif p{margin:0;color:var(--ink);font-size:13px;line-height:1.5;font-weight:650;}
  .purif small{display:block;margin-top:7px;color:var(--faint);font-size:11px;line-height:1.45;}
  .purif.clean,.purif.pending{background:var(--surface);border-color:var(--line);}
  .purif.clean .ph,.purif.pending .ph{color:var(--muted);}
  .purif.clean p,.purif.pending p{color:var(--muted);font-weight:600;}

  /* ---- Sparkline + inline intervals (muted evidence) ---- */
  .perf-spark{padding:6px 16px 4px;color:var(--muted);}
  .spark{display:block;width:100%;height:40px;}
  .perf-inline{padding:2px 16px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:650;}
  .perf-inline .pi{font-variant-numeric:tabular-nums;}
  .perf-inline .pi em{font-style:normal;color:var(--faint);font-weight:800;font-size:10px;letter-spacing:.4px;margin-right:4px;}
  .perf-inline .sep{color:var(--faint);}

  /* ===== Light Watchlist / Discover (handoff D) ===== */
  .wl-title{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-top:6px;}
  .wl-seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:16px;}
  .wl-seg button{flex:1;text-align:center;padding:9px 0;border-radius:9px;border:0;background:transparent;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .wl-seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 6px -3px rgba(16,26,45,.3);}
  .wl-sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:22px 2px 12px;}
  .wl-card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--shadow);}
  .wl-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .wl-id{display:flex;align-items:center;gap:12px;min-width:0;}

const FB = Object.freeze({ impureMax: 5, debtAdvisory: 33 });
function classifyFB(rec = {}) {
  const impure   = Number(rec.impurePct     ?? rec.impure_pct     ?? 0);

  const business = rec.businessStatus       ?? rec.business_status ?? "pass";
  if (business === "fail" || impure > FB.impureMax) return "fail";
  if (business === "pass" && impure === 0 && debt <= FB.debtAdvisory) return "clean";
  return "purify"; // non-zero impure income (<=5%), business "watch", or debt over advisory
}
// Display label. Rows with no screening data are shown as "unscreened" (a UI/data

const isFund = t => (t.kind||"").toLowerCase().includes("fund");
const sideLabel = s => "Disclosed " + (String(s).toUpperCase()==="SELL" ? "Sell" : "Buy");

const TYPE_LABEL = k => {
  const s = (k||"").toLowerCase();
  if (s.includes("insider")) return "Insider · Form 4";
  if (s.includes("congress") || s.includes("official") || s.includes("senate") || s.includes("house")) return "Officials";

  if (s.includes("congress") || s.includes("official") || s.includes("senate") || s.includes("house")) return "official";

/* Roll disclosures up into followable sources with a verdict mix + recent activity. */
function deriveSources(trades){
  const map = new Map();
  for (const t of (trades||[])) {
    const key = t.actor || "Unknown source";
    if (!map.has(key)) map.set(key, {name:key, kind:t.kind, initials:t.initials||"·", fund:isFund(t), group:sourceGroup(t.kind), clean:0, purify:0, fail:0, unscreened:0, count:0, latest:null});
    const s = map.get(key);
    s.count++;
    if (t.label==="clean") s.clean++;
    else if (t.label==="fail") s.fail++;
    else if (t.label==="purify") s.purify++;
    else s.unscreened++; // unscreened/unknown must NOT inflate the Purify mix
    const d = Date.parse(t.filingDate || t.transactionDate || "");
    if (!Number.isNaN(d) && (s.latest===null || d>s.latest)) s.latest = d;

  if (ms==null) return null;
  return Math.max(0, Math.round((Date.now()-ms)/86400000));

/* ---------- performance (evidence since a disclosure — NOT returns/advice) ----------

const DAY_MS = 86400000;
function median(arr){
  if (!arr.length) return null;
  const s = [...arr].sort((a,b)=>a-b);
  const m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;

function pctChange(from, to){
  if (from==null || to==null || !isFinite(from) || from===0) return null;
  return (to-from)/from*100;
}
function fmtPct(v){
  if (v==null || !isFinite(v)) return null;
  return (v>=0 ? "▲ " : "▼ ") + Math.abs(v).toFixed(1) + "%";

// history is [{d,c}] ascending. mode "onOrAfter" = first close on/after target (for trade date);
// otherwise nearest trading day at/just before target (for fixed intervals).
function histClose(history, targetMs, mode){
  if (!history || !history.length) return null;
  if (mode==="onOrAfter"){
    for (const p of history){ if (Date.parse(p.d) >= targetMs) return p.c; }
    return null; // target is after the last cached day
  }
  let atOrBefore=null, nearest=null, nearestDiff=Infinity;
  for (const p of history){
    const t = Date.parse(p.d);
    if (t<=targetMs) atOrBefore = p.c;
    const diff = Math.abs(t-targetMs);
    if (diff<nearestDiff){ nearestDiff=diff; nearest=p.c; }
  }
  return atOrBefore!=null ? atOrBefore : nearest;
}
// -> { since, w1, m1, m3, y1, updatedAt } or null when no cached price data.
function perfFor(t, prices){
  const p = prices && prices[t.ticker];
  if (!p || p.quote==null || !p.history || !p.history.length) return null;
  const now = Number(p.quote);
  const tradeMs = Date.parse(t.transactionDate || "");
  const since = Number.isNaN(tradeMs) ? null : pctChange(histClose(p.history, tradeMs, "onOrAfter"), now);
  const iv = d => pctChange(histClose(p.history, Date.now()-d*DAY_MS, "nearest"), now);

function amountMidpoint(amount){
  const nums = String(amount||"").match(/[\d,]+(?:\.\d+)?/g);

  const v = nums.map(n=>Number(n.replace(/,/g,""))).filter(n=>!Number.isNaN(n));

// Advisory purification preview tied to the verdict — muted/gold, NOT a fatwa.
// Returns { kind, text, note } or null (fail = no line).
function purificationPreview(t, prices){
  if (t.screened===false) return { kind:"pending", text:"Pending screening — purification can’t be estimated yet." };
  if (t.label==="fail") return null;
  const impure = Number(t.impurePct||0);
  if (t.label==="clean" || impure<=0) return { kind:"clean", text:"No purification required — permissible business with no impure income." };
  // purify-at-sale
  const p = prices && prices[t.ticker];
  const quote = (p && p.quote!=null) ? Number(p.quote) : null;
  if (quote==null) {
    return { kind:"purify", text:`~${impure}% of any gain would be owed to charity at sale.`, note:"Purification applies at sale — amount pending live price." };
  }
  const disclosed = Number(t.purchasePrice) || (p.history ? histClose(p.history, Date.parse(t.transactionDate||""), "onOrAfter") : null);
  const mid = (t.amountMid!=null && t.amountMid!=="" ? Number(t.amountMid) : null) || amountMidpoint(t.amount);
  let estStr = "";
  if (disclosed && mid && isFinite(disclosed) && disclosed>0){
    const gain = mid * (quote/disclosed - 1);
    const owed = gain>0 ? (impure/100)*gain : 0;
    estStr = ` (≈ $${owed.toFixed(2)} on the disclosed amount today)`;
  }
  return { kind:"purify", text:`~${impure}% of any gain would be owed to charity at sale${estStr}.`, note:"Estimate — informational only, not a fatwa." };
}

// Inline SVG price trend from the cached daily history — shape only, no axes, muted.
/* ---------- light-redesign (handoff) detail helpers ---------- */
const DXV = {
  clean:      { word:"Clean",          txt:"#12925A", fill:"#3ECB86", tint:"rgba(18,146,90,.11)",  head:"You can own this." },
  purify:     { word:"Purify at sale", txt:"#B87A0C", fill:"#F3B24A", tint:"rgba(184,122,12,.11)", head:"Buyable — with a cost." },
  fail:       { word:"Fail",           txt:"#D24A41", fill:"#F0625A", tint:"rgba(210,74,65,.11)",  head:"You can’t own this." },
  unscreened: { word:"Unscreened",     txt:"#6B7690", fill:"#AAB3C4", tint:"rgba(107,118,144,.12)",head:"We can’t tell you yet." },
};
function daysBetween(a, b){
  const t1 = Date.parse(a||""), t2 = Date.parse(b||"");
  if (Number.isNaN(t1) || Number.isNaN(t2)) return null;
  return Math.max(0, Math.round((t2 - t1) / DAY_MS));
}
function fmtPctCompact(v){
  if (v==null || !isFinite(v)) return null;
  return (v>=0 ? "▲" : "▼") + Math.abs(v).toFixed(1) + "%";
}
// Business description with a leading "Pass/Fail/Watch — " prefix (from the DB) stripped.
function bizPhrase(t){
  const b = String(t.business||"").replace(/^\s*(pass|fail|watch)[^—]*—\s*/i, "").trim();
  return b || "the disclosed business";
}
// One plain-language supporting line naming the company + reason.
function supportLine(t){
  const co = t.company || t.ticker;
  const impure = Number(t.impurePct||0);
  if (t.screened===false) return `${co} hasn’t been screened yet — treat it as manual review, not as compliant.`;
  if (t.label==="clean")  return `${co} — ${bizPhrase(t)}. A permissible business with no impure income.`;
  if (t.label==="purify") return `${co} — a permissible business, but about ${impure}% of revenue is impure, so a share of any gain is owed to charity at sale.`;
  if (t.label==="fail")   return `${co} — excluded at the business-activity level (${bizPhrase(t)}).`;
  return `${co} — manual review.`;
}

function Sparkline({history}){
  if (!history || history.length<2) return null;
  const W=300, H=40, pad=3;
  const cs = history.map(p=>Number(p.c));
  const min = Math.min(...cs), max = Math.max(...cs), range = (max-min)||1, n = cs.length;
  const pts = cs.map((c,i)=>{
    const x = pad + (i/(n-1))*(W-2*pad);
    const y = pad + (1-(c-min)/range)*(H-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return html`<svg class="spark" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" width="100%" height="40" role="img" aria-label="Price trend over the cached history">
    <polyline points=${pts} fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

      </div>
    </div></div>`;
}

function Settings({onReplayIntro}){
  return html`
    <div class="scroll"><div class="page">
      <h2>Settings</h2>
      <p class="note">Mizān is dark-first and English for now; Arabic (RTL) is on the roadmap.</p>
      <div class="vcard"><div class="vh"><b style=${{fontSize:"14px"}}>Methodology</b></div>
        <p>Framework B · Hanbali. Permissible activity required; impure income ≤ 5%; debt advisory only.</p></div>
      <div class="vcard"><div class="vh"><b style=${{fontSize:"14px"}}>Getting started</b></div>
        <p>Re-run the short intro to how verdicts work and choose which sources you follow.</p>
        <button class="link-btn" style=${{marginTop:"8px"}} onClick=${onReplayIntro}>Replay intro</button></div>
      <div class="vcard"><div class="vh"><b style=${{fontSize:"14px"}}>Disclaimer</b></div>
        <p>Mizān provides informational disclosure monitoring and Sharia screening only. It is not investment advice, a brokerage service, or a formal fatwa.</p></div>
    </div></div>`;
}

/* ---------- first-run guided intro (2–3 steps) ---------- */
function Onboarding({sources, isFollowed, setFollow, onDone}){
  const [step,setStep] = useState(0);
  const STEPS = 3;
  return html`
    <div class="intro">
      <div class="steps">${Array.from({length:STEPS}).map((_,i)=>html`<i key=${i} class=${i<=step?"on":""}></i>`)}</div>
      <div class="body">
        ${step===0 && html`
          <${React.Fragment}>
            <h2>Every name gets a verdict</h2>
            <p class="lead">Before a disclosure reaches your alerts, Mizān screens it under Framework B (Hanbali). There are three outcomes:</p>
            <div class="vrow"><span class="badge clean">Clean</span><div class="vt"><b>Clean</b><small>Permissible business with no impure income — nothing to purify.</small></div></div>
            <div class="vrow"><span class="badge purify">Purify</span><div class="vt"><b>Purify-at-sale</b><small>Buyable, but a purification amount applies at sale — some impure income, or debt over the advisory level.</small></div></div>
            <div class="vrow"><span class="badge fail">Fail</span><div class="vt"><b>Fail</b><small>Impermissible business activity, or impure income above 5%.</small></div></div>
          </${React.Fragment}>`}
        ${step===1 && html`
          <${React.Fragment}>
            <h2>Pick a few sources to follow</h2>
            <p class="lead">Following a source subscribes you to its future disclosures — for screening and alerts, never copy-trading.</p>
            ${sources.length ? sources.map(s=>html`
              <${SourceCard} key=${s.name} s=${s} on=${isFollowed(s.name)} onToggle=${()=>setFollow(s.name,!isFollowed(s.name))} />`)
              : html`<div class="empty">Sources appear here once your feed loads.</div>`}
          </${React.Fragment}>`}
        ${step===2 && html`
          <${React.Fragment}>
            <h2>You’re all set</h2>
            <p class="lead">Your Alerts feed now screens disclosures from the sources you follow. The verdict logic never changes — but you can adjust who you follow anytime under Discover.</p>
            <div class="vrow"><span class="badge clean">✓</span><div class="vt"><b>Informational only</b><small>Mizān is disclosure monitoring and Sharia screening — not investment advice, brokerage, or a fatwa.</small></div></div>
          </${React.Fragment}>`}
      </div>
      <div class="intro-actions">
        ${step>0 && html`<button class="btn-ghost" onClick=${()=>setStep(step-1)}>Back</button>`}
        ${step===0 && html`<button class="btn-ghost" onClick=${onDone}>Skip</button>`}
        <button class="btn-primary" onClick=${()=> step<STEPS-1 ? setStep(step+1) : onDone()}>
          ${step<STEPS-1 ? "Continue" : "Go to Alerts"}
        </button>
      </div>
    </div>`;
}

const TABS = [["alerts","◈","Alerts"],["discover","◎","Watchlist"],["verdicts","✓","Verdicts"],["settings","☰","Settings"]];

function App(){
  const [trades,setTrades] = useState(null);
  const [tab,setTab] = useState("alerts");
  const [filter,setFilter] = useState("all");
  const [selected,setSelected] = useState(null);
  const [sheet,setSheet] = useState(false);
  const [follows,setFollows] = useState({});   // source name -> boolean (explicit); default = followed
  const [intro,setIntro] = useState(false);
  const [prices,setPrices] = useState({});     // ticker -> { quote, history, updatedAt } from /api/prices
  const [filer,setFiler] = useState(null);     // actor name -> filer track-record screen
  const idByName = useRef({});

  // Load the disclosure feed; fall back to sample data if the API is unreachable.
  useEffect(()=>{
    let alive = true;
    fetch("/api/feed",{headers:{accept:"application/json"}})
      .then(r=>r.ok?r.json():Promise.reject())
      .then(data=>{
        const rows = Array.isArray(data)?data:(data&&data.disclosures)||[];
        if(alive) setTrades((rows.length?rows:SAMPLE).map(t=>({...t,label:labelOf(t)})));
      })
      .catch(()=>{ if(alive) setTrades(SAMPLE.map(t=>({...t,label:labelOf(t)}))); });
    return ()=>{alive=false;};
  },[]);

  // Best-effort: hydrate follow state from /api/watchlist if it's reachable (auth-gated).
  useEffect(()=>{
    let alive = true;
    fetch("/api/watchlist",{headers:{accept:"application/json"}})
      .then(r=>r.ok?r.json():Promise.reject())
      .then(rows=>{
        if(!alive || !Array.isArray(rows) || !rows.length) return;
        const f={}, ids={};
        for(const r of rows){ if(r && r.name){ f[r.name] = r.on!==false; ids[r.name] = r.id; } }
        idByName.current = ids;
        setFollows(prev=>({...f,...prev})); // keep any explicit choices the user already made
      })
      .catch(()=>{ /* local state only — fine for now */ });
    return ()=>{alive=false;};
  },[]);

  // Load the cached price data once (read-only cache; UI computes intervals client-side).
  // Empty/failed -> {} so every ticker shows "Price pending" instead of a fake 0%.
  useEffect(()=>{
    let alive = true;
    fetch("/api/prices",{headers:{accept:"application/json"}})
      .then(r=>r.ok?r.json():Promise.reject())
      .then(d=>{ if(alive && d && typeof d==="object") setPrices(d); })
      .catch(()=>{ /* no cache yet — Price pending everywhere */ });
    return ()=>{alive=false;};
  },[]);

  // Show the guided intro on first run (deployed site has localStorage; artifacts don't).
  useEffect(()=>{
    try{ if(!localStorage.getItem("mizan_onboarded")) setIntro(true); }catch(e){ /* storage blocked: skip */ }
  },[]);

  const dismissIntro = ()=>{
    setIntro(false); setTab("alerts");
    try{ localStorage.setItem("mizan_onboarded","1"); }catch(e){}
  };

  const isFollowed = name => follows[name] !== false; // default: followed
  const setFollow = (name,on)=>{
    setFollows(prev=>({...prev,[name]:on}));
    const id = idByName.current[name];
    if(id!=null){
      fetch("/api/watchlist",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,on})}).catch(()=>{});
    }
  };

  const loaded = trades!==null;
  const all = trades||[];
  const shown = all.filter(t=>filter==="all"||t.label===filter);
  const sources = deriveSources(all);
  const todayStr = fmtToday();

  const Alerts = html`
    <div class="panel">
      <div class="topbar">
        <div class="brand">
          <svg class="mmark" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
            <path d="M4 20 L4 9 L13 15 L22 9 L22 20" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg><b>Mizān</b>
        </div>
        <span class="topdate">${todayStr}</span>
      </div>
      <div class="scroll">
        ${!loaded ? html`<div class="loading">Loading disclosures…</div>` : html`
          <${Balance} trades=${all} />
          <div class="segment">
            ${[["all","All"],["clean","Clean"],["purify","Purify"],["fail","Fail"],["unscreened","Unscreened"]].map(s=>html`
              <button key=${s[0]} class=${"seg "+s[0]+" "+(filter===s[0]?"active":"")} onClick=${()=>setFilter(s[0])}>
                ${s[0]!=="all" && html`<span class=${"dot "+s[0][0]}></span>`}${s[1]}
              </button>`)}
          </div>
          <div class="list-head"><h2>Latest disclosures</h2><span>${shown.length} shown</span></div>
          ${shown.length ? html`<div class="list">${shown.map(t=>html`<${Card} key=${t.id||t.ticker+t.filingDate} t=${t} onOpen=${()=>setSelected(t)} prices=${prices} />`)}</div>`
            : html`<div class="empty">No disclosures match this filter yet.</div>`}
        `}
      </div>
    </div>`;

  return html`
    <div class="app">
      ${tab==="alerts" ? Alerts
        : tab==="discover" ? html`<div class="panel"><${Discover} sources=${sources} isFollowed=${isFollowed} setFollow=${setFollow}/></div>`
        : tab==="verdicts" ? html`<div class="panel"><${Verdicts} trades=${all}/></div>`
        : html`<div class="panel"><${Settings} onReplayIntro=${()=>setIntro(true)}/></div>`}

      <nav class="tabs">
        ${TABS.map(x=>html`
          <button key=${x[0]} class=${"tab "+(tab===x[0]?"active":"")} onClick=${()=>setTab(x[0])}>
            <span class="ti">${x[1]}</span>${x[2]}
          </button>`)}
      </nav>

      <${FilerScreen} actor=${filer} trades=${all} prices=${prices} onClose=${()=>setFiler(null)} onOpenTicker=${(t)=>setSelected(t)} />
      <${Detail} t=${selected} onClose=${()=>setSelected(null)} prices=${prices} onOpenFiler=${(a)=>setFiler(a)} />
      <${FilterSheet} open=${sheet} onClose=${()=>setSheet(false)} />
      ${intro && html`<${Onboarding} sources=${sources} isFollowed=${isFollowed} setFollow=${setFollow} onDone=${dismissIntro} />`}
    </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
