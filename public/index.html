<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mizān — Sharia market intelligence</title>
<meta name="description" content="Mizān — a Sharia-aware market-intelligence terminal. Disclosed portfolios and stocks with AAOIFI Standard No. 21 screening." />
<meta name="theme-color" content="#101812" />
<script>if (location.protocol !== "file:") document.write('<base href="/">');</script>
<link rel="stylesheet" href="./styles/index.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Primary">
    <a class="brand" href="/" data-nav="discover"><div class="brandmark">M</div><div><strong id="brandName">Mizan</strong><small id="brandSub">Financial Intelligence</small></div></a>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <input class="search" id="search" type="search" autocomplete="off" />
      <div class="topactions">
        <span class="chip" id="dataChip"></span>
        <button class="btn btn-secondary" id="kbdBtn" type="button" title="Search">⌘ K</button>
        <button class="btn btn-primary" id="topFollow" type="button"></button>
      </div>
    </header>
    <nav class="mobile-nav" id="mobileNav" aria-label="Primary"></nav>
    <main class="main" id="main"></main>
  </div>
</div>
<!-- TradingView Lightweight Charts (open source), pinned by SRI and loaded async: the shared chart()
     renders its SVG immediately and app.js upgrades detail charts when this arrives. Cached prices only. -->
<script id="lwjs" async src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK" crossorigin="anonymous"></script>
<script src="./app.js"></script>
</body>
</html>
